<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Support Support</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 500px;
            height: 680px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-avatar {
            width: 42px;
            height: 42px;
            background: rgba(255,255,255,0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .header-info .name {
            font-size: 15px;
            font-weight: 600;
        }

        .header-info .status {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: #4ade80;
            border-radius: 50%;
            display: inline-block;
        }

        /* Messages area */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: #f8f9fb;
        }

        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }

        /* Message rows */
        .message-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            animation: fadeUp 0.2s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .message-row.user { flex-direction: row-reverse; }

        .row-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .row-avatar.bot { background: linear-gradient(135deg, #667eea, #764ba2); }
        .row-avatar.user { background: #e0e7ff; }

        .message {
            max-width: 72%;
            padding: 11px 15px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.55;
        }

        .message.bot {
            background: #fff;
            color: #1a1a2e;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .message.user {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        /* Markdown-like rendering */
        .message strong { font-weight: 600; }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 12px 15px;
            background: #fff;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            width: fit-content;
        }

        .typing-indicator span {
            width: 7px;
            height: 7px;
            background: #aaa;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30%            { transform: translateY(-6px); }
        }

        /* Input area */
        .chat-input {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border-top: 1px solid #eee;
            gap: 10px;
            background: #fff;
        }

        .chat-input input {
            flex: 1;
            padding: 11px 16px;
            border: 1.5px solid #e5e7eb;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            background: #f8f9fb;
            transition: border-color 0.2s;
        }

        .chat-input input:focus {
            border-color: #667eea;
            background: #fff;
        }

        .send-btn {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: opacity 0.2s, transform 0.1s;
        }

        .send-btn:hover { opacity: 0.9; transform: scale(1.05); }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-avatar">🤖</div>
            <div class="header-info">
                <div class="name">BotHelp — Customer Support</div>
                <div class="status">
                    <span class="status-dot"></span> Online · here to help
                </div>
            </div>
        </div>

        <div class="chat-messages" id="messages">
            <div class="message-row bot">
                <div class="row-avatar bot">🤖</div>
                <div class="message bot">Hi! I'm BotHelp, your Customer Support support assistant. Ask me about your orders, returns, or store policies. 😊</div>
            </div>
        </div>

        <div class="chat-input">
            <input type="text" id="input" placeholder="Ask about your order..." autocomplete="off" />
            <button class="send-btn" id="sendBtn" title="Send">
                &#10148;
            </button>
        </div>
    </div>

    <script>
        const messagesEl = document.getElementById("messages");
        const inputEl = document.getElementById("input");
        const sendBtn = document.getElementById("sendBtn");

        // Minimal markdown: **bold** and newlines
        function renderMarkdown(text) {
            return text
                .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
                .replace(/\n/g, "<br>");
        }

        function addMessage(html, role, isHTML = false) {
            const row = document.createElement("div");
            row.className = `message-row ${role}`;

            const avatar = document.createElement("div");
            avatar.className = `row-avatar ${role}`;
            avatar.textContent = role === "bot" ? "🤖" : "🧑";

            const bubble = document.createElement("div");
            bubble.className = `message ${role}`;
            if (isHTML) bubble.innerHTML = html;
            else bubble.textContent = html;

            row.appendChild(avatar);
            row.appendChild(bubble);
            messagesEl.appendChild(row);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return bubble;
        }

        function addTypingIndicator() {
            const row = document.createElement("div");
            row.className = "message-row bot";
            row.id = "typing-row";

            const avatar = document.createElement("div");
            avatar.className = "row-avatar bot";
            avatar.textContent = "🤖";

            const indicator = document.createElement("div");
            indicator.className = "typing-indicator";
            indicator.innerHTML = "<span></span><span></span><span></span>";

            row.appendChild(avatar);
            row.appendChild(indicator);
            messagesEl.appendChild(row);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function removeTypingIndicator() {
            const el = document.getElementById("typing-row");
            if (el) el.remove();
        }

        async function sendMessage() {
            const message = inputEl.value.trim();
            if (!message) return;

            inputEl.value = "";
            sendBtn.disabled = true;
            addMessage(message, "user");
            addTypingIndicator();

            try {
                const res = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message }),
                });
                const data = await res.json();
                removeTypingIndicator();
                addMessage(renderMarkdown(data.response), "bot", true);
            } catch {
                removeTypingIndicator();
                addMessage("Something went wrong. Please try again.", "bot");
            } finally {
                sendBtn.disabled = false;
                inputEl.focus();
            }
        }

        sendBtn.addEventListener("click", sendMessage);
        inputEl.addEventListener("keydown", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
